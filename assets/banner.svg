<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.7; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.2) translate(-20px, 20px); opacity: 0.6; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }
    @keyframes shimmer {
      0% { stop-color: #6366f1; }
      50% { stop-color: #ec4899; }
      100% { stop-color: #6366f1; }
    }
    .orb1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 150px; }
    .orb2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 280px; }
    .particle { animation: floatParticle 4s ease-in-out infinite; }
    .particle-delay { animation: floatParticle 5s ease-in-out infinite 1.5s; }
    .stream-line { stroke-dasharray: 6, 6; animation: dashCycle 2.5s linear infinite; }
    .tech-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Grid overlay -->
  <g opacity="0.12">
    <path d="M 0,70 L 1200,70 M 0,140 L 1200,140 M 0,210 L 1200,210 M 0,280 L 1200,280 M 0,350 L 1200,350" stroke="#94a3b8" stroke-width="1" />
    <path d="M 150,0 L 150,420 M 300,0 L 300,420 M 450,0 L 450,420 M 600,0 L 600,420 M 750,0 L 750,420 M 900,0 L 900,420 M 1050,0 L 1050,420" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Animated Background Glow Orbs (Strictly placed in background) -->
  <circle class="orb1" cx="220" cy="140" r="130" fill="#6366f1" filter="url(#softGlow)" />
  <circle class="orb2" cx="980" cy="270" r="150" fill="#ec4899" filter="url(#softGlow)" />
  <circle cx="600" cy="210" r="90" fill="#06b6d4" opacity="0.2" filter="url(#softGlow)" />

  <!-- Dynamic Circuit / AI Agent Network Traces -->
  <g opacity="0.45">
    <path class="stream-line" d="M 120,330 C 260,330 320,240 450,240 S 580,310 750,310 S 920,220 1080,220" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="stream-line" d="M 100,110 C 240,110 350,180 500,180 S 680,100 850,100 S 1000,160 1100,160" fill="none" stroke="#ec4899" stroke-width="1.5" />
    <circle class="particle" cx="450" cy="240" r="4" fill="#38bdf8" />
    <circle class="particle-delay" cx="750" cy="310" r="5" fill="#f472b6" />
    <circle class="particle" cx="850" cy="100" r="4.5" fill="#a78bfa" />
  </g>

  <!-- Foreground Content: Pill Badge -->
  <g transform="translate(600, 75)">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="url(#badgeGrad)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="-142" cy="0" r="5" fill="#10b981" />
    <text class="tech-font" x="-125" y="5" fill="#c7d2fe" font-size="13" font-weight="600" letter-spacing="1.5">⚡ CURATED AI &amp; AGENTIC CRM STACK</text>
  </g>

  <!-- Foreground Content: Main Title -->
  <g transform="translate(600, 160)">
    <!-- Crisp Foreground Title -->
    <text class="tech-font" text-anchor="middle" x="0" y="0" font-size="50" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Awesome AI-Powered CRM
    </text>
    <!-- Sub-heading Label -->
    <text class="tech-font" text-anchor="middle" x="0" y="42" font-size="20" font-weight="500" fill="#e2e8f0" letter-spacing="0.2">
      Autonomous Sales Agents • Predictive Scoring • Model Context Protocol (MCP)
    </text>
    <text class="tech-font" text-anchor="middle" x="0" y="74" font-size="15" font-weight="400" fill="#94a3b8">
      Top Enterprise SaaS Platforms &amp; Self-Hosted Open-Source Architectures
    </text>
  </g>

  <!-- Foreground Feature Badges / Highlights -->
  <g transform="translate(600, 310)">
    <!-- Tag 1: Twenty & Relaticle -->
    <g transform="translate(-360, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
      <text class="tech-font" text-anchor="middle" x="0" y="5" fill="#93c5fd" font-size="13" font-weight="600">🤖 Agentic Workflows</text>
    </g>

    <!-- Tag 2: MCP Protocol -->
    <g transform="translate(-120, 0)">
      <rect x="-105" y="-16" width="210" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
      <text class="tech-font" text-anchor="middle" x="0" y="5" fill="#c084fc" font-size="13" font-weight="600">🔌 Native MCP Servers</text>
    </g>

    <!-- Tag 3: Predictive Intelligence -->
    <g transform="translate(130, 0)">
      <rect x="-105" y="-16" width="210" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
      <text class="tech-font" text-anchor="middle" x="0" y="5" fill="#f472b6" font-size="13" font-weight="600">🎯 Predictive Scoring</text>
    </g>

    <!-- Tag 4: Self-Hosted & Open Source -->
    <g transform="translate(370, 0)">
      <rect x="-100" y="-16" width="200" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
      <text class="tech-font" text-anchor="middle" x="0" y="5" fill="#34d399" font-size="13" font-weight="600">🛡️ Self-Hosted Privacy</text>
    </g>
  </g>

  <!-- Clean Frame Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
